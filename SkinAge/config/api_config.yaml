# =============================================================================
# api_config.yaml
# SkinAge ML — API Server Settings, Quality Gates, and Inference Config
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# workers=4 matches a typical 4-vCPU deployment; increase for higher
# throughput at the cost of additional memory per worker.
# -----------------------------------------------------------------------------
server:
  host: "0.0.0.0"           # Bind to all interfaces; reverse proxy handles TLS
  port: 8000
  workers: 4
  timeout_seconds: 30       # Request timeout before 504 is returned to client
  keep_alive_seconds: 5

# -----------------------------------------------------------------------------
# Image Upload Constraints
# Hard limits applied before any processing begins to protect server resources.
# -----------------------------------------------------------------------------
upload:
  max_image_size_mb: 10
  allowed_formats:
    - jpeg
    - jpg
    - png

# -----------------------------------------------------------------------------
# Image Quality Gates
# Images that fail any of these checks are rejected with an informative error
# before inference is attempted. Thresholds are tuned to the training data
# distribution — inputs outside these bounds produce unreliable predictions.
#
# face_confidence       — MediaPipe detection confidence; filters non-face images
# max_yaw               — Maximum horizontal head rotation (degrees)
# max_pitch             — Maximum vertical head rotation (degrees)
# min_blur              — Laplacian variance floor; rejects motion/defocus blur
# min_brightness        — Mean pixel intensity floor; rejects underexposed images
# max_brightness        — Mean pixel intensity ceiling; rejects overexposed images
# min_face_size         — Minimum bounding-box side length (pixels at 512px scale)
# min_landmark_visibility — MediaPipe visibility score for required landmarks
# -----------------------------------------------------------------------------
quality_thresholds:
  face_confidence: 0.70
  max_yaw: 25               # Degrees; beyond this pose estimation degrades
  max_pitch: 20             # Degrees
  min_blur: 80              # Laplacian variance; lower = blurrier
  min_brightness: 40        # 0–255 scale
  max_brightness: 220       # 0–255 scale
  min_face_size: 200        # Pixels; ensures sufficient texture resolution
  min_landmark_visibility: 0.90  # Fraction of required landmarks clearly visible

# -----------------------------------------------------------------------------
# Model Artefact Paths
# Paths are relative to the project root. The ONNX model is used when the
# inference device is CPU or when onnx_runtime is explicitly selected.
# -----------------------------------------------------------------------------
model:
  model_path: outputs/models/best_model.pth   # PyTorch checkpoint
  onnx_path:  outputs/models/skinage.onnx     # Exported ONNX graph

# -----------------------------------------------------------------------------
# Inference Settings
# device=auto selects CUDA if available, then MPS (Apple Silicon),
# falling back to CPU. batch_timeout_ms controls the maximum time the server
# waits to accumulate a micro-batch before dispatching — reduces GPU idle time
# under moderate load without significantly increasing p99 latency.
# -----------------------------------------------------------------------------
inference:
  device: auto               # Options: auto | cpu | cuda | mps
  batch_timeout_ms: 100      # Max wait for micro-batch assembly
  input_size: 512            # Must match image_size in data_config.yaml
  fp16: false                # Enable half-precision for faster CUDA inference

# -----------------------------------------------------------------------------
# Response Format
# Controls which fields are included in the JSON response payload.
# Disabling heavy fields (heatmaps) can significantly reduce response size
# for clients that only need the scalar scores.
# -----------------------------------------------------------------------------
response:
  include_heatmaps: true     # Base64-encoded per-concern heatmap images
  include_zone_scores: true  # Per-zone x per-concern quality scores
  include_age: true          # Predicted biological skin age
  include_landmarks: false   # Raw MediaPipe landmark coordinates (debug only)

# -----------------------------------------------------------------------------
# Logging and Monitoring
# -----------------------------------------------------------------------------
logging:
  level: INFO                # Options: DEBUG | INFO | WARNING | ERROR
  log_failed_quality_checks: true   # Log rejections for distribution monitoring
  log_inference_latency: true       # Track p50/p95/p99 latency per endpoint
